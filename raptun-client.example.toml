# Example Raptun client configuration.
#
# Precedence when a value is set in multiple places:
#   CLI flag  >  environment variable  >  this file  >  built-in default
#
# Pass with:  raptun-client -c raptun-client.example.toml
#
# Phase-1 tuning: the Phase-1 congestion optimisation plan landed defaults of
# sockbuf=512 KiB, keepalive=3 s, idle_timeout=10 s, repair_cwnd_frac=0.20
# (see docs/raptun-congestion-optimization-plan.md §5). This example mirrors
# those defaults so anyone copying it gets the optimised behaviour.
#
# Notes on the values below:
#   * symbol_size=1100: this is the *effective* negotiated value. Both client
#     and server CLI default to 1200, but the server clamps the negotiated
#     value to SAFE_MAX_SYMBOL_SIZE=1100 (crates/raptun-core/src/session.rs
#     `clamp_fec`) so a framed symbol fits in one QUIC datagram. Setting 1100
#     here avoids the `clamp_fec: client symbol_size adjusted by server`
#     warning that the Issue 2 fix added to make the silent clamp visible.

localaddr   = "127.0.0.1:12948"
remoteaddr  = "vps.example.com:29900"
listen_mode = "tcp"                       # tcp | socks5

# Application-level auth (NOT encryption; QUIC/TLS already encrypts).
# The "env:" prefix pulls the value from the named environment variable so the
# secret is not stored in plaintext.
psk         = "env:RAPTUN_PSK"

# Trust-on-first-use: pin the server's self-signed cert fingerprint.
fingerprint = "SHA256:a1b2c3d4e5f6..."
sni         = "raptun"

[fec]
scheme      = "raptorq"                    # off | raptorq | xor
mode        = "adaptive"                   # adaptive | fixed
ratio       = 0.15                         # used only when mode = "fixed"
min         = 0.02                         # adaptive lower bound
max         = 0.50                         # adaptive upper bound
symbol_size = 1100                         # effective (server clamps 1200 -> 1100)
# block_size = 64                          # omit for auto (derive from RTT)
repair_cwnd_frac = 0.20                    # Phase-1 default; range 0.10-0.40

[transport]
cc            = "bbr"                       # bbr | cubic | newreno
mtu           = 1350
datagram      = true                       # false => reliable streams, FEC off
stream_rwnd   = 2097152                     # 2 MiB
conn_rwnd     = 16777216                    # 16 MiB
max_streams   = 1024                        # concurrent tunnelled streams per connection
sockbuf       = 524288                      # 512 KiB (Phase-1; was 4 MiB)
dgram_sndbuf  = 2097152                     # 2 MiB datagram send buffer
keepalive     = 3                           # seconds; 0 disables; must be < idle_timeout
idle_timeout  = 10                          # seconds
heartbeat     = 30                          # seconds; periodic "tunnel alive" log at info level, 0 disables
migration     = true
zero_rtt      = true
dscp          = 0
